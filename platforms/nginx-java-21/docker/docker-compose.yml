services:

  apirest:
    image: ${COMPOSE_LEAD}-${COMPOSE_NAME}:${COMPOSE_IMGK}
    pull_policy: never
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
        - USER=${COMPOSE_USER}
        - GROUP=${COMPOSE_GROUP}
    container_name: ${COMPOSE_LEAD}-${COMPOSE_NAME}
    volumes:
      - type: bind
        source: ${COMPOSE_PATH}
        target: /var/www
    deploy:
      resources:
        limits:
          cpus: ${COMPOSE_CPUS}
          memory: ${COMPOSE_MEM}
    tty: true
    restart: unless-stopped